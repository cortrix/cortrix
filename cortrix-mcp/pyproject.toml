[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortrix-mcp"
version = "1.0.0rc1"
description = "Cortrix MCP Server — expose the Cortrix HTTP API as MCP tools for IDE agents (Claude Code / Cline / Cursor)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cortrix" }]
keywords = ["mcp", "model-context-protocol", "cortrix", "rag", "semantic-search", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cortrix-mcp = "cortrix_mcp.server:main"

[project.urls]
Homepage = "https://github.com/cortrix/cortrix"
Documentation = "https://github.com/cortrix/cortrix/tree/main/cortrix-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/cortrix_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
