# =============================================================
# Stage 3: Release Gate
# Manual workflow_dispatch before a release. Target < 4 hr.
#
# Hard gates: all Stage-2 gates + cross-platform E2E 100% +
# CE/Ent isolation 0 leaks + Lighthouse Perf≥80/A11y≥90 +
# Trivy no HIGH/CRITICAL + SBOM artifacts + HF integrity.
# Soft: bundle size vs baseline +5%.
#
# Repo-reality adaptations:
#   - image tag = cortrix:<release_tag> built from deploy/Dockerfile
#   - the immutable source revision is supplied separately from the image tag
# =============================================================
name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      source_revision:
        description: Full 40-character source commit to validate
        required: true
        type: string
      validation_scope:
        description: Run the full release gate or only the isolation and image job
        required: false
        type: choice
        default: full
        options:
          - full
          - isolation_and_image

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EVENT_SOURCE_REVISION: ${{ github.sha }}
      WORKFLOW_SOURCE_REVISION: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Validate release source, workflow, and version identity
        shell: bash
        run: |
          if ! [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be a full lowercase commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$EVENT_SOURCE_REVISION" = "$SOURCE_REVISION"
          test "$WORKFLOW_SOURCE_REVISION" = "$SOURCE_REVISION"

          EXPECTED_TAG="v$(tr -d '\r\n' < VERSION)"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "release_tag must match VERSION: expected $EXPECTED_TAG"
            exit 1
          fi
          python3 scripts/sync_version.py --check

  stage2_full:
    needs: identity
    if: ${{ inputs.validation_scope == 'full' }}
    uses: ./.github/workflows/nightly-ci.yml
    with:
      source_revision: ${{ inputs.source_revision }}

  cross_platform_e2e:
    needs: stage2_full
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: E2E
        run: |
          cd web
          npm ci --ignore-scripts
          npx playwright install --with-deps
          npx playwright test

  isolation_and_image:
    needs: [identity, stage2_full]
    if: >-
      ${{
        always() &&
        needs.identity.result == 'success' &&
        (
          inputs.validation_scope == 'isolation_and_image' ||
          (inputs.validation_scope == 'full' && needs.stage2_full.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      IMAGE_TAG: cortrix:${{ inputs.release_tag }}
      COMPOSE_PROJECT_NAME: cortrix_release_gate
      CORTRIX_SOURCE_REVISION: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false

      - name: Validate immutable release identity
        run: |
          if ! [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be a full lowercase commit SHA"
            exit 1
          fi
          if ! [[ "${IMAGE_TAG#cortrix:}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "release_tag contains unsupported characters"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Validate release version consistency
        run: python3 scripts/sync_version.py --check

      - name: CE/Ent isolation scan (0 leaks, MUST)
        run: |
          # Public feature-contract names are allowed. Executable coupling to the
          # commercial edition is not.
          python3 - <<'PY'
          import re
          from pathlib import Path

          roots = (Path("src"), Path("include"))
          suffixes = {".cpp", ".cc", ".h", ".hpp"}
          sources = sorted(
              path
              for root in roots
              for path in root.rglob("*")
              if path.is_file() and path.suffix in suffixes
          )

          if len(sources) <= 100:
              raise SystemExit(
                  f"open-core scan expected more than 100 source files; found {len(sources)}"
              )

          rules = (
              (
                  "enterprise qualified reference",
                  re.compile(r"\bcortrix[.:/_-]+enterprise\b", re.IGNORECASE),
                  "cortrix.enterprise",
              ),
              (
                  "enterprise build macro",
                  re.compile(
                      r"\b(CORTRIX_ENTERPRISE|WITH_ENTERPRISE|CORTRIX_ENT|ENABLE_ENTERPRISE)\b"
                  ),
                  "CORTRIX_ENTERPRISE",
              ),
              (
                  "enterprise conditional compilation",
                  re.compile(
                      r"#\s*if(?:def|ndef)?\b.*\b(ENTERPRISE|ENT_|WITH_ENT)",
                      re.IGNORECASE,
                  ),
                  "#ifdef WITH_ENTERPRISE",
              ),
              (
                  "enterprise namespace",
                  re.compile(r"namespace\s+enterprise\b"),
                  "namespace enterprise",
              ),
              (
                  "enterprise class or interface",
                  re.compile(r"\b(class|struct)\s+(I?Enterprise[A-Za-z0-9_]*)\b"),
                  "class IEnterpriseConnector",
              ),
              (
                  "enterprise header include",
                  re.compile(
                      r"#\s*include\s*[<\"][^>\"]*enterprise[^>\"]*[>\"]",
                      re.IGNORECASE,
                  ),
                  '#include "cortrix/enterprise/connector.h"',
              ),
              (
                  "enterprise extension table",
                  re.compile(
                      r"CREATE\s+TABLE[^;]*\b(audit_log_extension|agent_trace_extension|interaction_sources_extension)\b",
                      re.IGNORECASE,
                  ),
                  "CREATE TABLE audit_log_extension (id INTEGER)",
              ),
          )

          for label, pattern, sentinel in rules:
              if pattern.search(sentinel) is None:
                  raise SystemExit(f"open-core scan rule is ineffective: {label}")

          if not any(
              "namespace cortrix" in path.read_text(encoding="utf-8", errors="replace")
              for path in sources
          ):
              raise SystemExit("open-core scan did not read the CE source tree")

          violations = []
          for path in sources:
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8", errors="replace").splitlines(),
                  start=1,
              ):
                  for label, pattern, _ in rules:
                      if pattern.search(line):
                          violations.append(f"{path}:{line_number}: [{label}] {line}")

          if violations:
              print("CE tree references commercial internals:")
              print("\n".join(violations))
              raise SystemExit(1)

          print(f"isolation OK: scanned {len(sources)} CE source files")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Production web audit and build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Health and Docker contracts
        run: |
          bash deploy/test_healthcheck.sh
          CORTRIX_TEST_DOCKER_BUILD=1 bash deploy/test_docker_build.sh

      - name: Build release image
        id: build
        run: |
          grep -Fqx 'COPY LICENSE NOTICE.md /app/' deploy/Dockerfile
          grep -Fqx 'COPY LICENSE NOTICE.md /app/' deploy/Dockerfile.cuda
          grep -Fqx 'COPY pyproject.toml README.md LICENSE NOTICE.md ./' cortrix-mcp/Dockerfile
          docker build \
            --build-arg "CORTRIX_SOURCE_REVISION=$SOURCE_REVISION" \
            -t "$IMAGE_TAG" \
            -f deploy/Dockerfile .
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_REVISION"
          docker run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c \
            'test -f /app/LICENSE && test -f /app/NOTICE.md'

      - name: Generate SPDX and CycloneDX SBOMs
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/artifacts:/artifacts" \
            anchore/syft:v1.48.0 "$IMAGE_TAG" \
            -o spdx-json=/artifacts/sbom.spdx.json \
            -o cyclonedx-json=/artifacts/sbom.cdx.json

      - name: Runtime QuickStart and network-none proof
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          docker tag "$IMAGE_TAG" cortrix:quickstart
          docker compose -f deploy/docker-compose.yml up --no-build --wait

          test "$(docker compose -f deploy/docker-compose.yml port cortrix 8420)" = "127.0.0.1:8420"
          curl -fsS http://127.0.0.1:8420/api/v1/system/health/ready > /tmp/ready.json
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"namespaces":["demo"],"query":"What does semantic storage keep close to the agents that need it?","top_k":5,"rerank":true}' \
            http://127.0.0.1:8420/api/v1/query > /tmp/query.json

          python3 - <<'PY'
          import json

          with open("/tmp/query.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          def collect_scores(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "rerank_score" and isinstance(child, (int, float)):
                          yield child
                      yield from collect_scores(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from collect_scores(child)

          assert list(collect_scores(payload)), "query response has no numeric rerank_score"
          assert "quickstart-demo.txt" in json.dumps(payload), "query response is not source-backed"
          PY

          docker compose -f deploy/docker-compose.yml down
          VOLUME="$(docker volume ls --format '{{.Name}}' | grep '^cortrix_release_gate_cortrix-data$')"
          test -n "$VOLUME"

          docker run -d --name cortrix-network-none \
            --network none \
            --mount "source=$VOLUME,target=/data" \
            -e CORTRIX_PROFILE=quickstart \
            -e CORTRIX_LLM_ENABLED=false \
            -e CORTRIX_AGENT_ENABLED=false \
            -e CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED=true \
            -e CORTRIX_QUICKSTART_READY_FILE=/data/quickstart/ready.json \
            -e CORTRIX_EMBEDDING_EXECUTION_PROVIDER=cpu \
            -e CORTRIX_RERANKER_EXECUTION_PROVIDER=cpu \
            -e CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND=true \
            -e "CORTRIX_SOURCE_REVISION=$SOURCE_REVISION" \
            "$IMAGE_TAG"

          for _ in $(seq 1 120); do
            STATUS="$(docker inspect cortrix-network-none --format '{{.State.Health.Status}}')"
            if [ "$STATUS" = "healthy" ]; then break; fi
            if [ "$STATUS" = "unhealthy" ]; then docker logs cortrix-network-none; exit 1; fi
            sleep 5
          done
          test "$(docker inspect cortrix-network-none --format '{{.State.Health.Status}}')" = "healthy"
          NETWORK_MODE="$(docker inspect cortrix-network-none --format '{{.HostConfig.NetworkMode}}')"
          PUBLISHED_PORTS="$(docker port cortrix-network-none 2>/dev/null || true)"
          printf 'network-none state: mode=%s published_ports=%s\n' \
            "$NETWORK_MODE" "${PUBLISHED_PORTS:-<none>}"
          test "$NETWORK_MODE" = "none"
          test -z "$PUBLISHED_PORTS"
          docker exec cortrix-network-none curl -fsS http://127.0.0.1:8420/api/v1/system/health/ready
          docker exec cortrix-network-none curl -fsS -H 'Content-Type: application/json' \
            -d '{"namespaces":["demo"],"query":"What does semantic storage keep close to the agents that need it?","top_k":5,"rerank":true}' \
            http://127.0.0.1:8420/api/v1/query > /tmp/network-none-query.json
          python3 - <<'PY'
          import json

          with open("/tmp/network-none-query.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert "rerank_score" in json.dumps(payload), "network-none query was not reranked"
          assert "quickstart-demo.txt" in json.dumps(payload), "network-none query is not source-backed"
          PY
          docker stop cortrix-network-none

      - name: External-address negative controls
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/negative-controls
          for index in 1 2; do
            if [ "$index" = 1 ]; then HOST=0.0.0.0; else HOST=192.0.2.10; fi
            LOG="artifacts/negative-controls/${index}.log"
            set +e
            docker run --rm \
              --network none \
              -e CORTRIX_AUTH_ENABLED=false \
              -e "CORTRIX_SERVER_HOST=$HOST" \
              -e CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND=false \
              --entrypoint /app/cortrix_server \
              "$IMAGE_TAG" --config /app/config/cortrix.yaml >"$LOG" 2>&1
            STATUS=$?
            set -e
            cat "$LOG"
            if [ "$STATUS" -eq 0 ]; then
              echo "Core accepted an unauthenticated non-loopback bind for $HOST"
              exit 1
            fi
            grep -F "server.host must be loopback when auth.enabled=false" "$LOG"
          done

      - name: Trivy image scan (hard gate)
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/artifacts:/artifacts" \
            aquasec/trivy:0.72.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output /artifacts/trivy.json \
            "$IMAGE_TAG"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE_TAG"

      - name: Cleanup release-gate runtime
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down --remove-orphans || true
          docker rm -f cortrix-network-none cortrix-negative-1 cortrix-negative-2 2>/dev/null || true
          docker volume rm cortrix_release_gate_cortrix-data 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ inputs.release_tag }}
          path: |
            artifacts/sbom.*.json
            artifacts/trivy.json
            artifacts/negative-controls/*.log
          if-no-files-found: error

  lighthouse:
    needs: stage2_full
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lighthouse CI (Perf ≥ 80 / A11y ≥ 90)
        run: |
          cd web
          npm ci --ignore-scripts
          npm run build
          npx @lhci/cli autorun --config=lighthouserc.json

  hf_model_integrity:
    needs: stage2_full
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Pinned model manifest contract
        run: |
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path, PurePosixPath

          manifest = Path("deploy/model-manifest.tsv")
          required_fields = [
              "component", "destination", "repository", "revision", "source_path",
              "size_bytes", "sha256", "upstream_repository", "upstream_revision",
              "license",
          ]
          required_components = {
              "embedding_model", "embedding_tokenizer",
              "reranker_model", "reranker_tokenizer",
          }
          approved_identity = {
              "embedding_model": (
                  "bge-m3/model.onnx", "onnx-community/bge-m3-ONNX",
                  "25b9af8e87a38eb120cfe87125383677b9cd309e",
                  "onnx/model_quantized.onnx", "568479395",
                  "2237f770aad5c71bbc1fc2d361a57f9a37400574cc9eff32626f0cdb49234730",
                  "BAAI/bge-m3", "5617a9f61b028005a4858fdac845db406aefb181",
                  "MIT",
              ),
              "embedding_tokenizer": (
                  "bge-m3/tokenizer.json", "onnx-community/bge-m3-ONNX",
                  "25b9af8e87a38eb120cfe87125383677b9cd309e",
                  "tokenizer.json", "17082799",
                  "249df0778f236f6ece390de0de746838ef25b9d6954b68c2ee71249e0a9d8fd4",
                  "BAAI/bge-m3", "5617a9f61b028005a4858fdac845db406aefb181",
                  "MIT",
              ),
              "reranker_model": (
                  "bge-reranker-v2-m3/model.onnx",
                  "onnx-community/bge-reranker-v2-m3-ONNX",
                  "6f5ff65298512715a1e669753bc754d2bc8f367b",
                  "onnx/model_quantized.onnx", "570727094",
                  "912fc1215c2dbff6499700534bd8d31253af01573861abbfc43afd1fab6cce5d",
                  "BAAI/bge-reranker-v2-m3",
                  "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e",
                  "Apache-2.0",
              ),
              "reranker_tokenizer": (
                  "bge-reranker-v2-m3/tokenizer.json",
                  "onnx-community/bge-reranker-v2-m3-ONNX",
                  "6f5ff65298512715a1e669753bc754d2bc8f367b",
                  "tokenizer.json", "17082900",
                  "8bf8afbfd11306bd872018c53bfdf2e160a56f8edbcf49933324404791c148d3",
                  "BAAI/bge-reranker-v2-m3",
                  "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e",
                  "Apache-2.0",
              ),
          }

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          with manifest.open(encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle, delimiter="\t")
              require(reader.fieldnames == required_fields,
                      f"unexpected manifest fields: {reader.fieldnames}")
              rows = list(reader)

          require(all(None not in row for row in rows),
                  "manifest row has more columns than the header")
          require(len(rows) == len(required_components),
                  f"expected {len(required_components)} model assets, found {len(rows)}")
          require({row["component"] for row in rows} == required_components,
                  "manifest component set is incomplete or duplicated")
          require(len({row["component"] for row in rows}) == len(rows),
                  "manifest contains duplicate components")
          require(len({row["destination"] for row in rows}) == len(rows),
                  "manifest contains duplicate destinations")
          for row in rows:
              destination = PurePosixPath(row["destination"])
              require(not destination.is_absolute() and ".." not in destination.parts,
                      f"unsafe destination: {destination}")
              require(re.fullmatch(r"[^/\s]+/[^/\s]+", row["repository"]),
                      f"invalid repository: {row['repository']}")
              require(re.fullmatch(r"[^/\s]+/[^/\s]+", row["upstream_repository"]),
                      f"invalid upstream repository: {row['upstream_repository']}")
              require(re.fullmatch(r"[0-9a-f]{40}", row["revision"]),
                      f"invalid revision for {row['component']}")
              require(re.fullmatch(r"[0-9a-f]{40}", row["upstream_revision"]),
                      f"invalid upstream revision for {row['component']}")
              require(re.fullmatch(r"[0-9a-f]{64}", row["sha256"]),
                      f"invalid sha256 for {row['component']}")
              require(row["size_bytes"].isdigit() and int(row["size_bytes"]) > 0,
                      f"invalid size for {row['component']}")
              require(bool(row["source_path"] and row["license"]),
                      f"missing source path or license for {row['component']}")
              actual_identity = tuple(row[field] for field in required_fields[1:])
              require(actual_identity == approved_identity[row["component"]],
                      f"unapproved model identity for {row['component']}")

          print(f"validated {len(rows)} pinned model assets")
          PY
