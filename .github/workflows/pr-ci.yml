# =============================================================
# Stage 1: PR CI
# Target < 10 min design budget; real-world C++ build needs ccache
# warm cache to approach it, so job timeout is set wider.
#
# Repo-reality adaptations vs the design sketch (all intentional):
#   - web uses npm + vitest (no pnpm, no separate test:unit script)
#   - python tests live per-component (cortrix-agent/, sdk/python, ...)
#   - ctest selects suites via -L labels (added in tests/CMakeLists.txt)
#   - lint is SOFT until the legacy-formatting decision is made
# Hard gates: unit tests 100% PASS, build OK.
# =============================================================
name: PR CI

on:
  push:
    # feat/** removed: those branches are already covered by their pull_request
    # run, and the duplicate push run doubled CI cost for zero extra signal.
    # (concurrency groups are intentionally NOT added here — they are designed
    # together with the post-merge main lane, see RC-PERIODIC-CI-CADENCE.)
    branches: [main]
  pull_request:

jobs:
  cpp_unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential libssl-dev libsqlite3-dev libpq-dev ccache

      # CCACHE_DIR is pinned explicitly: ccache 3.x defaulted to ~/.ccache but
      # ccache 4.x (shipped on ubuntu-22.04) defaults to ~/.cache/ccache, so the
      # previous `path: ~/.ccache` cached a directory that never existed —
      # every restore missed and every save failed with a Path Validation Error,
      # making all builds cold. Keep path and CCACHE_DIR in sync.
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-pr-${{ runner.os }}-${{ github.base_ref || 'main' }}-${{ github.run_id }}
          restore-keys: |
            ccache-pr-${{ runner.os }}-${{ github.base_ref || 'main' }}-
            ccache-pr-${{ runner.os }}-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.ccache"
          ccache --version

      - name: Configure (Debug)
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 2 --target cortrix_unit_tests

      # Hit rate is recorded on every run so "is the cache actually working?"
      # is verifiable evidence rather than an assumption.
      - name: ccache stats
        if: always()
        run: ccache -s | tee -a "$GITHUB_STEP_SUMMARY"

      # Suites run as separate processes via ctest (one proc per test);
      # never run the whole suite in a single process (known SIGSEGV mode).
      # -j 2 matches the 2-core standard runner; each test is still its own
      # process, so this does not change the isolation property above.
      - name: Unit Tests (C++)
        run: ctest --test-dir build -L unit -j 2 --output-on-failure

  frontend_unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Component Tests (Vitest)
        run: |
          cd web
          npm ci --ignore-scripts
          npm test

  python_unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python Unit Tests (per component)
        run: |
          set -e
          for comp in cortrix-agent cortrix-mcp sdk/python; do
            if [ -f "$comp/requirements.txt" ]; then
              pip install -q -r "$comp/requirements.txt" || true
            fi
            if [ -f "$comp/pyproject.toml" ]; then
              case "$comp" in
                cortrix-mcp)
                  pip install -q -e "$comp[test]" || pip install -q -e "$comp" || true
                  ;;
                sdk/python)
                  pip install -q -e "$comp[dev]" || pip install -q -e "$comp" || true
                  ;;
                *)
                  pip install -q -e "$comp" || true
                  ;;
              esac
            fi
            if [ -d "$comp/tests" ]; then
              echo "── pytest: $comp"
              (cd "$comp" && python -m pytest tests -m "not slow" -q)
            fi
          done

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # SOFT gate: legacy code predates .clang-format; hardening mode
    # (full reformat vs diff-only) remains a project-level decision.
    steps:
      - uses: actions/checkout@v4
      - name: Release version consistency
        run: python3 scripts/sync_version.py --check
      - name: clang-format (changed files only)
        continue-on-error: true
        run: |
          sudo apt-get install -y clang-format
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
          CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }} -- '*.cpp' '*.h' | grep -E '^(src|include|tests)/' || true)
          if [ -n "$CHANGED" ]; then
            clang-format --dry-run --Werror $CHANGED
          else
            echo "no C++ changes"
          fi
      - name: ruff (python)
        continue-on-error: true
        run: |
          pip install -q ruff
          ruff check cortrix-agent cortrix-mcp sdk/python

  # coverage_soft was removed from the PR lane.
  #
  # It was record-only (continue-on-error: true) yet took ~125 min — the single
  # largest cost in this workflow — and it never blocked a merge, so it spent
  # that time protecting nothing. It also duplicated work: coverage.sh --check
  # in the Nightly cpp_full job is a strict superset of --report-only (same
  # instrumented build and report, plus threshold enforcement), so the same SHA
  # had its gcov line coverage computed twice. Dropping it here removes the
  # duplicate and keeps the stricter of the two.
  #
  # Covered by: Nightly cpp_full -> scripts/ci/coverage.sh --check
  # Ref: RC1-CANONICAL-EVIDENCE-DEDUP (hub PR #17 triage, accepted).
