# =============================================================
# Stage 2: Nightly CI
# Cron 02:00 UTC+8 = 18:00 UTC. Target < 60 min.
#
# Hard gates:
#   - Coverage overall ≥ 80%, core-17 ≥ 90% line / ≥ 80% branch
#   - P0 100% PASS / P1 ≥ 98% PASS
#   - No High/Critical security findings
# Soft: P95 latency vs baseline ±10%.
#
# Repo-reality adaptations vs the design sketch:
#   - server listens on 8420 (not 9090) → ZAP target fixed
#   - snyk: no account/token yet → step disabled, Trivy covers
#     image CVEs at the release gate
#   - E2E via npm playwright (web/e2e), 4 browsers
# =============================================================
name: Nightly CI

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  cpp_full:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Release version consistency
        run: python3 scripts/sync_version.py --check
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libssl-dev libsqlite3-dev libpq-dev lcov ccache
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-nightly-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-nightly-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Configure (RelWithDebInfo)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel 2

      # Run one process per test via ctest.
      - name: Unit Tests
        run: ctest --test-dir build -L unit --output-on-failure
      - name: Integration Tests
        run: ctest --test-dir build -L integration --output-on-failure

      - name: Coverage Aggregate + Quality Gate (hard)
        run: ./scripts/ci/coverage.sh --check

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: build-cov/coverage/
          if-no-files-found: ignore

  asan:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libssl-dev libsqlite3-dev libpq-dev
      - name: Configure (ASAN)
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Unit under ASAN
        run: ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-asan -L unit --output-on-failure

  e2e_web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: E2E (Playwright, 4 browsers)
        run: |
          cd web
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit msedge
          npx playwright test

  perf_load:
    runs-on: ubuntu-22.04
    # Allow the 30-minute fail-closed cold-start window plus image build and load test.
    timeout-minutes: 60
    # Soft gate: P95 vs baseline ±10% — alert, don't block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t cortrix:nightly -f deploy/Dockerfile .
      - name: Boot stack
        run: |
          docker volume create cortrix-nightly-data
          docker run -d --name cortrix \
            -p 127.0.0.1:8420:8420 \
            -v cortrix-nightly-data:/data \
            -e CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND=true \
            cortrix:nightly
          READY=false
          for _ in $(seq 1 360); do
            if [ "$(docker inspect cortrix --format '{{.State.Running}}')" != "true" ]; then
              docker logs cortrix
              exit 1
            fi
            if curl -fsS http://localhost:8420/api/v1/system/health/ready >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 5
          done
          if [ "$READY" != "true" ]; then
            docker logs cortrix
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Locust load (100 users, 5 min)
        run: |
          pip install -q locust
          locust -f tests/load/locustfile.py --headless -u 100 -r 10 \
            --run-time 5m --host http://localhost:8420 \
            --csv build-load/nightly --exit-code-on-error 0
      - uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: build-load/
          if-no-files-found: ignore
      - name: Cleanup runtime
        if: always()
        run: |
          docker rm -f cortrix 2>/dev/null || true
          docker volume rm cortrix-nightly-data 2>/dev/null || true

  security_zap:
    runs-on: ubuntu-22.04
    # Allow the 30-minute fail-closed cold-start window plus image build and ZAP scan.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build + boot server
        run: |
          docker build -t cortrix:nightly -f deploy/Dockerfile .
          docker network create cortrix-zap
          docker volume create cortrix-zap-data
          docker run -d --name cortrix \
            --network cortrix-zap \
            -v cortrix-zap-data:/data \
            -e CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND=true \
            cortrix:nightly
          READY=false
          for _ in $(seq 1 360); do
            if [ "$(docker inspect cortrix --format '{{.State.Running}}')" != "true" ]; then
              docker logs cortrix
              exit 1
            fi
            if docker exec cortrix curl -fsS \
              http://127.0.0.1:8420/api/v1/system/health/ready >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 5
          done
          if [ "$READY" != "true" ]; then
            docker logs cortrix
            exit 1
          fi
      - name: OWASP ZAP baseline (hard gate on High/Critical)
        run: |
          docker run --rm --network cortrix-zap -v $(pwd):/zap/wrk ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://cortrix:8420 -c tests/security/zap-baseline.conf
      - name: Cleanup security runtime
        if: always()
        run: |
          docker rm -f cortrix 2>/dev/null || true
          docker network rm cortrix-zap 2>/dev/null || true
          docker volume rm cortrix-zap-data 2>/dev/null || true
      # snyk disabled: no org token provisioned yet (design lists it;
      # Trivy image scanning runs at the release gate.
