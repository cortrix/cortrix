# CUDA override for deploy/docker-compose.yml.
# Run both files together; the default compose file remains CPU-only.

services:
  cortrix:
    image: cortrix:cuda
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cuda
    environment:
      # The base file pins the CPU Quick Start. A CUDA deployment takes these
      # from the shell or from deploy/.env, which Compose reads for
      # substitution, so the values in the runbook reach the container.
      CORTRIX_PROFILE: ${CORTRIX_PROFILE:-quickstart}
      CORTRIX_EMBEDDING_EXECUTION_PROVIDER: ${CORTRIX_EMBEDDING_EXECUTION_PROVIDER:-auto}
      CORTRIX_RERANKER_EXECUTION_PROVIDER: ${CORTRIX_RERANKER_EXECUTION_PROVIDER:-auto}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Empty means "let the entrypoint decide by profile": on for quickstart, off otherwise.
      CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED: ${CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
