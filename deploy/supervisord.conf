[supervisord]
nodaemon=true
user=cortrix
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; RPC plumbing — required for the health-monitor's `supervisorctl restart`
; to actually reach supervisord (without these three sections supervisorctl
; cannot connect and every restart attempt fails silently).
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# =============================================================
# cortrix-server  (C++ core — HTTP API, SSC, Query Engine)
# =============================================================
[program:cortrix-server]
command=/app/cortrix_server --config /app/config/cortrix.yaml
directory=/app
user=cortrix
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=10
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    CORTRIX_DATA_DIR="%(ENV_CORTRIX_DATA_DIR)s",
    CORTRIX_HTTP_PORT="%(ENV_CORTRIX_HTTP_PORT)s",
    CORTRIX_SERVER_PORT="%(ENV_CORTRIX_SERVER_PORT)s",
    CORTRIX_LOG_LEVEL="%(ENV_CORTRIX_LOG_LEVEL)s",
    CORTRIX_LLM_ENABLED="%(ENV_CORTRIX_LLM_ENABLED)s",
    CORTRIX_LLM_API_KEY="%(ENV_CORTRIX_LLM_API_KEY)s",
    CORTRIX_LLM_PROVIDER="%(ENV_CORTRIX_LLM_PROVIDER)s",
    CORTRIX_LLM_MODEL="%(ENV_CORTRIX_LLM_MODEL)s",
    CORTRIX_LLM_BASE_URL="%(ENV_CORTRIX_LLM_BASE_URL)s",
    CORTRIX_ENABLE_MEMORY="%(ENV_CORTRIX_ENABLE_MEMORY)s"

# =============================================================
# cortrix-agent  (Python FastAPI — the built-in Agent, RAG via the SDK)
# =============================================================
[program:cortrix-agent]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port %(ENV_CORTRIX_AGENT_PORT)s
directory=/app/python/cortrix-agent
user=cortrix
autostart=%(ENV_CORTRIX_AGENT_ENABLED)s
autorestart=true
startsecs=5
startretries=3
priority=30
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; CORTRIX_CONFIG_PATH: cortrix-agent reads agent_llm from the unified config
; (config.py priority 3); unset it falls back to the mock provider silently.
; CORTRIX_BASE_URL: where the SDK reaches cortrix-server (same container).
environment=
    PYTHONPATH="/app/python",
    CORTRIX_CONFIG_PATH="/app/config/cortrix.yaml",
    CORTRIX_BASE_URL="http://127.0.0.1:%(ENV_CORTRIX_HTTP_PORT)s",
    CORTRIX_DATA_DIR="%(ENV_CORTRIX_DATA_DIR)s",
    CORTRIX_ENABLE_MEMORY="%(ENV_CORTRIX_ENABLE_MEMORY)s",
    CORTRIX_HTTP_PORT="%(ENV_CORTRIX_HTTP_PORT)s"

# =============================================================
# quickstart-bootstrap  (one-shot source-backed runtime proof)
# =============================================================
[program:quickstart-bootstrap]
command=/app/scripts/quickstart-bootstrap.sh
directory=/app
user=cortrix
autostart=%(ENV_CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED)s
autorestart=false
startsecs=0
startretries=0
exitcodes=0
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# =============================================================
# health-monitor  (lightweight loop — restarts services on failure)
# =============================================================
[program:health-monitor]
command=/bin/bash -c 'while true; do sleep 30; HTTP=$(curl -s -o /dev/null -w "%%{http_code}" http://127.0.0.1:${CORTRIX_HTTP_PORT:-8420}/api/v1/system/health/live 2>/dev/null); if [ "$HTTP" != "200" ]; then echo "[health-monitor] cortrix-server liveness failed (HTTP $HTTP), requesting restart"; supervisorctl -c /etc/supervisor/conf.d/cortrix.conf restart cortrix-server; fi; done'
directory=/app
user=cortrix
autostart=true
autorestart=true
startsecs=0
priority=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
