# =============================================================
# Cortrix all-in-one container — default configuration
# Baked into the image at /app/config/cortrix.yaml and consumed
# by supervisord:  cortrix_server --config /app/config/cortrix.yaml
#
# Every value can be overridden per deployment:
#   - bind-mount a replacement file over /app/config/cortrix.yaml, or
#   - set CORTRIX_* environment variables (env wins over this file;
#     see src/config/config.cpp ApplyEnvOverrides for the list).
# =============================================================

server:
  host: 0.0.0.0
  port: 8420

# Local-development stack default. The C++ core defaults to auth ON
# (secure-by-default); this dev compose ships with it off so the stack
# is usable out of the box. PRODUCTION: set enabled: true and provision
# api_keys (key_hash/tenant_id/permissions), or override via
# CORTRIX_AUTH_ENABLED=true.
auth:
  enabled: false

log:
  level: info

namespace:
  data_dir: /data

embedding:
  # bge-m3 ONNX assets are NOT baked into the image (too large). On first run
  # entrypoint.sh provisions them into the data volume at the paths below
  # (PROFILE=full). A configured path is mandatory: missing or invalid assets
  # fail startup. PROFILE=lite explicitly clears these paths before startup.
  model_path: /data/models/bge-m3/model.onnx
  tokenizer_path: /data/models/bge-m3/tokenizer.json
  execution_provider: auto

# F02 reranker — optional by default. entrypoint.sh sets the model directory
# when a complete operator-provided model is present. A non-empty but missing or
# invalid model fails startup; an empty model_dir is the explicit stub mode.
reranker:
  model_dir: ""
  execution_provider: auto

# F39/F37 query-complexity classifier — provisioned when
# CORTRIX_QUERY_COMPLEXITY_MODEL_URL is set; absent = heuristic fallback.
query_complexity:
  model_dir: /data/models/query-complexity

# F06 document parser — the docling/paddleocr bridge scripts are auto-located
# at /app/scripts. python_bin defaults to the system python3 so the txt/md
# plain-text fast path (stdlib only) works out of the box, including PROFILE=lite.
# In PROFILE=full, entrypoint.sh repoints this at the provisioned parser venv
# (/data/ocr_venv) once it exists, enabling docling/paddleocr for PDF/image.
spc:
  python_bin: python3

# --- LLM roles (all optional; unset = feature stays off) ---
# Connection trio per role: provider / api_key / model / base_url.
#
# semantic_llm:      # intent classification & reranking
# vision_llm:        # image/PDF visual parsing
# agent_llm:         # agent demo chat
# doc_summary_llm:   # F41 document summary index
# enricher_llm:      # F03 LLM enricher (NER + summary)
#   provider: openai
#   api_key: sk-...
#   model: gpt-4o-mini
#   base_url: https://api.openai.com/v1
