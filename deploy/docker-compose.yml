# Cortrix Local Development — Docker Compose
#
# Usage:
#   cp deploy/.env.example deploy/.env   # edit API keys
#   docker compose -f deploy/docker-compose.yml up -d
#   curl http://localhost:8420/api/v1/health

version: "3.8"

services:
  # ---- Cortrix all-in-one ----
  cortrix:
    image: cortrix:latest                # reused when already built (CI/smoke builds it explicitly)
    build:
      context: ..                        # repo root
      dockerfile: deploy/Dockerfile
    container_name: cortrix
    ports:
      - "${CORTRIX_HTTP_PORT:-8420}:8420"
    volumes:
      - cortrix-data:/data
    env_file:
      - .env
    environment:
      CORTRIX_DATA_DIR: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  cortrix-data:
    driver: local
