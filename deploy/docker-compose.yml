services:
  cortrix:
    image: cortrix:quickstart
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CORTRIX_SOURCE_REVISION: ${CORTRIX_SOURCE_REVISION:-local-source}
    ports:
      # Default publishes to loopback only (the Quick Start contract). To let
      # other machines on a trusted network reach the stack (e.g. a shared test
      # box), opt in explicitly with a routable address and a distinctive port:
      #   CORTRIX_PUBLISH_HOST=10.0.0.5 CORTRIX_HTTP_PORT=18420 docker compose up -d
      # Anything beyond loopback exposes the unauthenticated API to that
      # network — enable API-key auth first, or keep it to isolated test LANs.
      # See docs/QUICKSTART.md § "Publishing on a LAN address".
      - "${CORTRIX_PUBLISH_HOST:-127.0.0.1}:${CORTRIX_HTTP_PORT:-8420}:8420"
    volumes:
      - cortrix-data:/data
    environment:
      CORTRIX_DATA_DIR: /data
      CORTRIX_HTTP_PORT: "8420"
      # The API listens on the container interface, while Compose publishes it
      # exclusively to host loopback above. Core rejects this exception unless
      # it is explicitly enabled.
      CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND: "true"
      CORTRIX_PROFILE: quickstart
      CORTRIX_LLM_ENABLED: "false"
      CORTRIX_AGENT_ENABLED: "false"
      CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED: "true"
      CORTRIX_QUICKSTART_READY_FILE: /data/quickstart/ready.json
      CORTRIX_EMBEDDING_EXECUTION_PROVIDER: cpu
      CORTRIX_RERANKER_EXECUTION_PROVIDER: cpu
      CORTRIX_SOURCE_REVISION: ${CORTRIX_SOURCE_REVISION:-local-source}
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      start_period: 30m
      retries: 3

volumes:
  cortrix-data:
    driver: local
