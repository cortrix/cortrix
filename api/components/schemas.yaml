# components/schemas.yaml — core dataclasses (gathered in reverse from ARCH § 4.1.x + P03 v1.0.1 types)
#
# SoT: ARCHITECTURE.md § 4.1.1-4.1.11 per-domain request/response examples + each Feature's detailed design + P03 v1.0.1 types.
# Field names are stable and backward-compatible (AGENT_FRIENDLY principle 7). ULID uses string (ARCH § 1.8 + V5 resolution #6A).
#
# Relational-model fields (P03-1 collaboration): visibility / ns_acl / dedup_scope / isolation_mode / owner_node_id.
components:
  schemas:

    # ============ Namespace domain (ARCH § 4.1.1) ============
    ChunkStrategy:
      type: object
      properties:
        max_tokens:
          type: integer
          minimum: 1
          example: 512
        overlap_tokens:
          type: integer
          minimum: 0
          example: 64

    NamespaceCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "contracts"
        display_name:
          type: string
          example: "Contract Document Library"
        description:
          type: string
          example: "Stores all customer contracts"
        embedding_model:
          type: string
          example: "bge-m3"
        chunk_strategy:
          $ref: '#/components/schemas/ChunkStrategy'
        # relational-model fields (P03-1)
        visibility:
          type: string
          enum: [private, tenant, public]
          default: private
          description: "NS visibility (private / within tenant / public)"
        isolation_mode:
          type: string
          enum: [shared, dedicated]
          description: "Resource isolation mode"

    Namespace:
      type: object
      required: [namespace, status]
      properties:
        namespace:
          type: string
          example: "contracts"
        display_name:
          type: string
        description:
          type: string
        embedding_model:
          type: string
          example: "bge-m3"
        chunk_strategy:
          $ref: '#/components/schemas/ChunkStrategy'
        status:
          type: string
          enum: [active, creating, deleting, error]
          example: active
        visibility:
          type: string
          enum: [private, tenant, public]
        isolation_mode:
          type: string
          enum: [shared, dedicated]
        owner_node_id:
          type: string
          nullable: true
          description: "ID of the node that owns this NS's data (distributed deployment, P03-1)"
        ns_acl:
          type: array
          description: "NS ACL grant list (P09 / P03-1; see NsAclEntry)"
          items:
            $ref: '#/components/schemas/NsAclEntry'
        created_at:
          type: string
          format: date-time
          example: "2026-04-02T10:00:00Z"

    # ============ Document domain (ARCH § 4.1.2 + F42) ============
    DocumentProgress:
      type: object
      properties:
        stage:
          type: string
          enum: [pending, parsing, chunking, embedding, indexing, ready, failed]
          example: embedding
        chunks_total:
          type: integer
          example: 42
        chunks_done:
          type: integer
          example: 28
        semantic_score:
          type: number
          format: float
          nullable: true
          example: 0.6

    Document:
      type: object
      required: [document_id, status]
      properties:
        document_id:
          type: string
          example: "doc_abc123"
        namespace:
          type: string
          example: "contracts"
        filename:
          type: string
          example: "contract_001.pdf"
        source_type:
          type: string
          description: >
            Origin class of the document row. `upload`/`http_upload` = direct upload;
            `watch_dir` = ingested from a watched directory (full path in source_path);
            `memory_session`/`memory` = synthetic conversation-memory artifacts (these
            are excluded from user file listings in the agent inventory + UI namespace
            drawer).
          enum: [upload, http_upload, watch_dir, memory_session, memory]
          nullable: true
          example: http_upload
        source_ref:
          type: string
          description: >
            External-origin locator for documents whose bytes live outside Cortrix
            (e.g. a watch_dir absolute path or an S3/object-store URI). Lets a caller
            answer "where is the source file" without Cortrix retaining the original.
            Null for plain uploads.
          nullable: true
          example: "s3://corp-docs/contracts/contract_001.pdf"
        status:
          type: string
          enum: [pending, parsing, chunking, embedding, indexing, ready, failed]
          example: processing
        progress:
          $ref: '#/components/schemas/DocumentProgress'
        content_hash:
          type: string
          example: "sha256:abc..."
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    DocumentTask:
      type: object
      description: "Asynchronous upload task."
      required: [task_id, status]
      properties:
        task_id:
          type: string
          example: "task_xxx_001"
        document_id:
          type: string
          nullable: true
        namespace:
          type: string
        status:
          type: string
          enum: [queued, processing, cancelling, completed, failed, cancelled]
          example: processing
          description: >-
            The task's lifecycle state, as reported by
            `GET /documents/tasks/{task_id}/progress`. On that endpoint these are
            exactly the values you can receive: the status is read straight from the
            tasks table, whose CHECK constraint admits this set and no other.

            The acceptance response of `POST /documents` also uses this schema, and
            there `status` is always `queued` — it is a fresh enqueue, not a reading
            of the table.

            `completed` is the terminal success state — wait for it, not for `ready`.

            `cancelling` is transient and observable, but it is not the only way a
            cancel resolves. Cancelling a task that has not started yet moves it
            straight to `cancelled`; cancelling one that is already running marks it
            and lets the worker stop at its next checkpoint, so a poll in between can
            observe `cancelling`. A cancel that arrives late can still finish as
            `completed` or `failed` — requesting cancellation is not a guarantee of
            the outcome, only of the request being recorded.

            Two values were listed here previously and are removed because the server
            never emitted either, and listing them led callers to wait for a value that
            never arrives. `ready` belongs to `Document.status`, which is a separate
            state machine for the document rather than for the task that processes it.
            `submitted` is the per-item acceptance marker in the `POST /documents/batch`
            response, not a task state; a task created by that endpoint starts at
            `queued` like any other. If you wrote code against either value on this
            field, it has been unreachable since the endpoint shipped.
        progress:
          $ref: '#/components/schemas/DocumentProgress'
        created_at:
          type: string
          format: date-time

    UploadDocumentResult:
      type: object
      description: >-
        Synchronous result of the multipart POST /namespaces/{ns}/documents file upload.
        Unlike the async POST /documents (which returns a task_id), this returns the doc_id
        directly. status reflects the outcome: pending (a new document, processing queued),
        updating (a new version of a filename already stored, processing queued) or skipped
        (unchanged content, not processed again).
      required: [doc_id, content_hash, status, source_path, message]
      properties:
        doc_id:
          type: string
        content_hash:
          type: string
          description: Content hash used for duplicate detection.
        status:
          type: string
          description: "One of pending, updating or skipped."
        superseded_doc_id:
          type: string
          description: >-
            Set only when status is updating: the doc_id of the newest live version this
            upload was compared against. That version keeps answering queries until the
            new one is ready; then every older version of the filename is retired.
        source_path:
          type: string
          description: The uploaded file's original filename.
        message:
          type: string

    # ============ Query domain (ARCH § 4.1.3 + F04 v1.0.3) ============
    QueryFilter:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date

    QueryRequest:
      type: object
      required: [query, namespaces]
      properties:
        query:
          type: string
          example: "Party A breach-of-contract clauses"
        namespaces:
          type: array
          description: >-
            Target NS array (the only valid format in V1). Single NS = ["contracts"]; cross-NS = multiple elements;
            all NS (those authorized, hard cap 100) = ["*"]. The MVP singular `namespace` → 400 CX_ERR_DEPRECATED_FIELD.
          items:
            type: string
          example: ["contracts", "support_docs"]
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          example: 10
        rerank:
          type: boolean
          default: true
        filter:
          $ref: '#/components/schemas/QueryFilter'
        include_sources:
          type: boolean
          description: "When true, results include provenance information"
        route:
          type: string
          enum: [auto, simple, complex, chat]
          description: "F39 query-complexity route override (also accepted as ?route query param; default auto). 'chat' takes the MEM02-only memory path."
        rag_fusion:
          type: boolean
          default: false
          description: "F36 RAG-Fusion opt-in (also accepted as ?rag_fusion=true). Off by default until the NS-config resolver lands (D3.5)."
        include_parent:
          type: boolean
          default: false
          description: >-
            Opt in to parent-block expansion: the highest-ranked results also carry the
            surrounding parent span in `parent_content`, plus the span's position in
            `metadata.parent_token_count` / `parent_byte_start` / `parent_byte_end`.
            Off by default. What "off" guarantees is precisely that: no parent text and
            no span metadata. It does not mean the response is unchanged in every field,
            because `parent_id` is populated on results either way -- that is the link
            to the parent, not its content. Requires `parent_expand_top_k` >= 1.
        parent_expand_top_k:
          type: integer
          minimum: 0
          default: 0
          description: >-
            How many of the returned results may carry parent text, counted down the FINAL
            ordering. Results with no parent to look up do not consume a slot. 0 means no
            expansion. There is no tuned default: the useful value depends on the caller's
            own response budget, so the caller supplies it.
        parent_max_bytes:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Upper bound on the TOTAL bytes of parent text in one response (not per
            namespace, not per result). Results are expanded in final order until the next
            one would exceed this, so the expanded set is always a prefix of the ordering.
            0 means no byte cap. A malformed value is rejected with 400 rather than coerced,
            because coercing it to 0 would silently switch the cap off.
        search_config:
          $ref: '#/components/schemas/SearchConfig'
        timeout_ms:
          type: integer
          nullable: true
          minimum: 100
          maximum: 30000
          description: >-
            The query's time budget in milliseconds, counted from when the server starts
            handling the request. It bounds waiting for the namespaces and the LLM calls
            (query expansion and LLM reranking). When it runs out the response is still
            HTTP 200 with what completed: the namespaces that had not answered are in
            `meta.namespaces_failed` with `CX_ERR_NS_TIMEOUT`, and the top-level `error`
            is `CX_ERR_SCATTER_TIMEOUT`. With RAG fusion, a join the budget cuts gives the
            same signal together with the `rag_fusion_degraded` warning.
            It must be an integer in [100, 30000]; anything else is a 400
            `CX_ERR_BAD_REQUEST`, and `null` counts as absent.
            With several namespaces the server also waits at most 5000 ms for each
            namespace, counted from when it reaches that namespace; a lone namespace is
            limited by the budget only. With a budget, every join's overall limit is the
            request's deadline: the server's own 30000 ms limit, counted from the start of
            the join, never comes first.
            The budget bounds waiting and the LLM calls; it is not a cap on a namespace's
            work. No step is interrupted, so a step that has started runs to its end and a
            response can arrive up to about one step after the budget. Each LLM attempt's
            connect, write and read phases are bounded by the time left, and no attempt
            starts with less than 50 ms left. Without a budget, work the server stopped
            waiting for runs to completion; with one, it stops at its next step once the
            deadline has passed.
            RAG fusion runs query expansion and its joins one after another against the
            same deadline, with no share reserved for any of them. Under the `always`
            activation policy expansion runs before any join, so a slow expansion can
            leave every join cut and the response without results; under
            `selective_margin` the original query's join runs first.
            The budget does not cover a query routed to the chat path, parent expansion,
            RAG fusion's final rerank, namespace authorization, a wait for a free worker,
            or the time before the server starts handling the request.
          example: 5000

    SearchConfig:
      type: object
      description: >-
        Per-query retrieval route toggles. Each route runs unless its flag is false;
        for example {"enable_bm25": false} skips the lexical route. A flag that is
        not a boolean is ignored.
      properties:
        enable_vector:
          type: boolean
          default: true
          description: "Run the dense-vector (HNSW) route."
        enable_bm25:
          type: boolean
          default: true
          description: "Run the lexical BM25 route."
        enable_sparse:
          type: boolean
          default: true
          description: "Run the sparse (learned lexical) route, where the namespace has a sparse index."

    QueryResultItem:
      type: object
      properties:
        child_id:
          type: string
          description: "child block ULID (ARCH § 1.8)"
          example: "01HXYZA0BC9876543ZYXWVU321"
        parent_id:
          type: string
          example: "01HXYZA0BC1234567890ABCDEF"
        content:
          type: string
        parent_content:
          type: string
          description: "F34 parent full text"
        evidence_kind:
          type: string
          enum: [chunk, document_summary, document_label]
          description: >-
            What `content` actually holds. `chunk` is a real passage from the document;
            `document_summary` is generated text about the document, not text from it;
            `document_label` is a bare name with no body evidence at all. Present so a
            caller can tell a quotable passage from a summary before relying on it.
            Present on every item of the retrieval routes; items of the chat route
            (`route: chat`) have their own shape (`child_id`, `content`, `memory_type`,
            `created_at`, `confidence`) and do not carry it.
        score:
          type: number
          format: float
          description: "final_score (output of the F07 SemanticScorer)"
          example: 0.892
        rerank_score:
          type: number
          format: float
          description: "cross-encoder score (F02)"
          example: 0.945
        namespace:
          type: string
          description: "NS source with the highest rerank_score"
        content_hash:
          type: string
        metadata:
          type: object
          additionalProperties: true
        score_signals:
          type: object
          description: >-
            The quality signals recorded for this chunk when it was ingested. Present
            only when at least one of them exists; each member is present only when
            that signal was recorded.
          properties:
            enriched_score:
              type: number
              format: float
              description: "Quality score recorded when the chunk was enriched."
            semantic_score:
              type: number
              format: float
              description: "Semantic quality score recorded when the chunk was written."

    QueryMeta:
      type: object
      description: "Metadata present on every query result: which namespaces were queried and answered, coverage and latency, and per-namespace failures."
      required: [namespaces_queried, namespaces_succeeded, coverage_ratio, latency_ms]
      properties:
        namespaces_queried:
          type: array
          items:
            type: string
        namespaces_succeeded:
          type: array
          items:
            type: string
        namespaces_failed:
          type: array
          items:
            type: object
            required: [namespace, error_code, retryable, category]
            properties:
              namespace: { type: string }
              error_code:
                type: string
                pattern: "^CX_ERR_[A-Z][A-Z_]*$"
              retryable: { type: boolean }
              category:
                type: string
                enum: [auth, quota, transient, permanent, timeout]
              retry_after_ms:
                type: integer
                nullable: true
              message: { type: string }
              structured_data:
                type: object
                additionalProperties: true
                description: >-
                  Machine-readable details of the failure. Always carries `namespace`;
                  other keys depend on `error_code`.
        coverage_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
        latency_ms:
          type: integer
        deduplicated_chunks:
          type: array
          description: >-
            One entry per chunk that several namespaces returned with the same content;
            the chunk appears once in `results`, from `primary_namespace`.
          items:
            type: object
            properties:
              content_hash: { type: string }
              primary_namespace: { type: string }
              namespaces:
                type: array
                items:
                  type: object
                  properties:
                    namespace: { type: string }
                    score: { type: number, format: float }
                    rerank_score: { type: number, format: float }
        deduplicated_chunks_count:
          type: integer
        warnings:
          type: array
          items:
            type: object
        via_path:
          type: string
          description: "F39 path marker, present on the chat route (e.g. 'chat_memory_only')."
        crag_verdict:
          type: string
          description: "F37 CRAG B-class verdict; present only when F37 ran (Complex route)."
        crag_action:
          type: string
          description: "F37 action taken for an ambiguous CRAG verdict; present alongside crag_verdict when set."

    QueryResult:
      type: object
      required: [results, meta]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/QueryResultItem'
        meta:
          $ref: '#/components/schemas/QueryMeta'
        explain:
          type: object
          additionalProperties: true
          description: >-
            Diagnostics about how the result was produced. Present only when the request
            asked for them (`?explain=true`).
        error:
          type: object
          additionalProperties: true
          description: >-
            Present, with HTTP 200, when the query as a whole ran out of its time budget
            and `results` and `meta` hold what completed; its code is then
            `CX_ERR_SCATTER_TIMEOUT`. Same shape as the `error` object
            of the standard error response, without `request_id`: `code`, `message`,
            `retryable`, `category`, `retry_after_ms` and `structured_data` (the last
            two may be null).
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            category:
              type: string
              enum: [auth, quota, transient, permanent, timeout]
            retry_after_ms:
              type: integer
              nullable: true
            structured_data:
              type: object
              nullable: true
              additionalProperties: true

    # ============ Memory domain (ARCH § 4.1.5 + MEM01/02/03/05) ============
    MemorySearchRequest:
      type: object
      required: [query, namespace, user_id]
      properties:
        query:
          type: string
          example: "the project progress the user mentioned last time"
        namespace:
          type: string
          example: "user_memory"
        user_id:
          type: string
          description: "Mandatory user_id filter (MEM05 isolation)"
          example: "user_001"
        top_k:
          type: integer
          default: 5

    MemorySearchResultItem:
      type: object
      description: "One conversation-memory search hit."
      required: [interaction_id, session_id, query_text, response_text, score, expired, created_at]
      properties:
        interaction_id: { type: string }
        session_id: { type: string }
        query_text: { type: string }
        response_text: { type: string }
        query_type: { type: string }
        score:
          type: number
          format: float
        expired: { type: boolean }
        created_at: { type: string }
        metadata: { type: string, description: "Raw metadata_json string (passed through as stored)." }

    MemorySearchResponse:
      type: object
      description: "POST /memory/search body. Semantic search over conversation memory, isolated per user."
      required: [results, total_results, latency_ms, degraded]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemorySearchResultItem'
        total_results: { type: integer }
        latency_ms: { type: integer }
        degraded:
          type: boolean
          description: "True when the query pipeline fell back to a degraded path."

    MemoryExtractedItem:
      type: object
      required: [block_id, type, content, confidence]
      properties:
        block_id: { type: string }
        type:
          type: string
          enum: [fact, preference, event]
        content: { type: string }
        confidence:
          type: number
          format: float

    MemoryExtractResponse:
      type: object
      description: "POST /memory/extract body. error is always null on success (stable schema)."
      required: [extracted_memories, error]
      properties:
        extracted_memories:
          type: array
          items:
            $ref: '#/components/schemas/MemoryExtractedItem'
        extract_meta:
          type: object
          description: "Present when the LLM ran."
          properties:
            llm_model: { type: string }
            contradictions_found: { type: integer }
        error:
          type: object
          nullable: true
          description: "Always null on success."

    MemoryCreateRequest:
      type: object
      required: [namespace, content, memory_type]
      properties:
        namespace:
          type: string
        content:
          type: string
          example: "User preference: use Markdown for report format"
        memory_type:
          type: string
          enum: [fact, preference, event]
        metadata:
          type: object
          additionalProperties: true

    Memory:
      type: object
      required: [memory_id, content, memory_type, status]
      properties:
        memory_id:
          type: string
          example: "mem_001"
        content:
          type: string
        memory_type:
          type: string
          enum: [fact, preference, event]
          description: "fact/preference are immune to decay; event decays by exp(-λ×age)"
        status:
          type: string
          enum: [valid, invalidated]
          description: "invalidated = deprecated but retained (always retained, never overwritten)"
        source_session_id:
          type: string
          nullable: true
        source_interaction_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        score:
          type: number
          format: float
          nullable: true

    # ============ Import domain (F16a Database Import) ============
    # Shapes mirror the live CE implementation:
    #   src/import/import_types.h (ImportRequest / ImportTaskProgress / ImportTaskStatus)
    #   src/import/import_response.cpp (BuildImportStartedResponse / BuildProgressResponse).
    ImportRequest:
      type: object
      description: |
        Database import request (POST /import/database). Exactly one of {table, sql} must be
        provided; table mode additionally accepts a filter JSON DSL (NOT raw SQL) + columns projection.
      required: [namespace, connection_ref]
      properties:
        namespace:
          type: string
          example: "sales"
        connection_ref:
          type: string
          description: "ref_id of a connection previously registered via POST /admin/db-connections."
          example: "db_conn_01H..."
        text_strategy:
          type: string
          enum: [per_row, merge]
          default: per_row
          description: "Row textualization strategy. 'template' was removed in v1.0.2."
        merge_size:
          type: integer
          default: 10
          minimum: 1
          description: "Rows concatenated into one Block (only used when text_strategy=merge)."
        table:
          type: string
          description: "Table mode: source table name (mutually exclusive with sql)."
        filter:
          type: object
          additionalProperties: true
          description: "Table mode: v1.0.2 JSON filter DSL (NOT raw SQL)."
        columns:
          type: array
          items:
            type: string
          description: "Table mode: column projection (empty = all)."
        sql:
          type: string
          description: "Custom SQL mode: the SELECT to import (mutually exclusive with table)."

    ImportTaskStarted:
      type: object
      description: "Acceptance ack for POST /import/database. status is always 'queued'; live status comes from GET /import/tasks/{task_id}/progress."
      required: [task_id, status, namespace, connection_ref, estimated_rows, queued_at, progress_endpoint, cancel_endpoint, error]
      properties:
        task_id:
          type: string
          example: "import_01H..."
        status:
          type: string
          enum: [queued]
        namespace:
          type: string
        connection_ref:
          type: string
        estimated_rows:
          type: integer
          format: int64
          description: "Seeded from the COUNT(*) pre-check (0 if unknown)."
        queued_at:
          type: string
          format: date-time
        progress_endpoint:
          type: string
          example: "/api/v1/import/tasks/import_01H.../progress"
        cancel_endpoint:
          type: string
          example: "/api/v1/import/tasks/import_01H..."
        error:
          type: object
          nullable: true
          description: "Always null on the success ack (GEN-Agent stable schema)."

    ImportTaskProgress:
      type: object
      description: "Import task progress snapshot. error is set only in the FAILED terminal state; cancel resolves to status=cancelled with no error."
      required: [task_id, status, progress, rows_imported, rows_total, rows_failed, started_at, estimated_completion_at, error]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelling, cancelled]
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "0.0 - 1.0"
        rows_imported:
          type: integer
        rows_total:
          type: integer
        rows_failed:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        estimated_completion_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          nullable: true
          description: "Set only in the FAILED terminal state; the GEN-Agent error object (same shape as ErrorResponseV1.error, NOT the {error:{...}} envelope)."
          required: [code, message, retryable, category]
          properties:
            code:
              type: string
              pattern: "^CX_ERR_[A-Z][A-Z_]*$"
            message: { type: string }
            retryable: { type: boolean }
            category:
              type: string
              enum: [auth, quota, transient, permanent, timeout]
            retry_after_ms:
              type: integer
              nullable: true
            structured_data:
              type: object
              additionalProperties: true

    DbConnection:
      type: object
      description: "A registered import connection as listed by GET /admin/db-connections. The DSN is never returned."
      required: [ref_id, name, host, db_name, registered_by, revoked]
      properties:
        ref_id:
          type: string
          example: "db_conn_01H..."
        name:
          type: string
        host:
          type: string
        db_name:
          type: string
        registered_by:
          type: string
        revoked:
          type: boolean

    # ============ Observability domain (F13 Agent Observability) ============
    # Shapes mirror the live CE serializers in src/server/routes/observability_routes.cpp
    # (TraceEntryToJson / TracesResponseToJson / SourcesViewToJson / InteractionListToJson).
    # Timestamps are raw stored Unix-ms integers (the writer stamps Unix ms).
    TraceEntry:
      type: object
      description: "One agent trace row. Optional columns are JSON null when unset (stable schema)."
      required: [session_id, trace_id, agent_id, method, params, result_summary, duration_ms, source, status, error_code, namespace_id, created_at]
      properties:
        session_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        agent_id: { type: string, nullable: true }
        method: { type: string }
        params: { type: string, nullable: true }
        result_summary: { type: string, nullable: true }
        duration_ms: { type: integer }
        source: { type: string }
        status: { type: string }
        error_code: { type: string, nullable: true }
        namespace_id: { type: string, nullable: true }
        created_at:
          type: integer
          format: int64
          description: "Raw stored Unix-ms timestamp."

    TraceSessionMeta:
      type: object
      required: [session_start, session_end, total_duration_ms, total_count, has_next, next_offset, response_size_warning]
      properties:
        session_start: { type: integer, format: int64, nullable: true }
        session_end: { type: integer, format: int64, nullable: true }
        total_duration_ms: { type: integer }
        total_count:
          type: integer
          description: "Total rows matching the filter (across pages)."
        has_next: { type: boolean }
        next_offset:
          type: integer
          nullable: true
          description: "Null when has_next is false."
        response_size_warning:
          type: boolean
          description: "§8.1 soft-limit flag."

    TraceSession:
      type: object
      description: "GET /traces/{session_id} body."
      required: [session_id, trace_count, traces, meta]
      properties:
        session_id: { type: string }
        trace_count:
          type: integer
          description: "Rows in this page."
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceEntry'
        meta:
          $ref: '#/components/schemas/TraceSessionMeta'

    InteractionListItem:
      type: object
      required: [interaction_id, session_id, user_id, namespace_id, role, query_text, query_type, created_at]
      properties:
        interaction_id: { type: string }
        session_id: { type: string }
        user_id: { type: string }
        namespace_id: { type: string }
        role: { type: string }
        query_text:
          type: string
          description: "Returned in full (not truncated)."
        query_type: { type: string }
        created_at: { type: integer, format: int64 }

    InteractionListMeta:
      type: object
      required: [total_count, has_next, next_offset]
      properties:
        total_count: { type: integer }
        has_next: { type: boolean }
        next_offset:
          type: integer
          nullable: true
          description: "Null when has_next is false."

    InteractionList:
      type: object
      description: "GET /interactions body."
      required: [interactions, meta]
      properties:
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/InteractionListItem'
        meta:
          $ref: '#/components/schemas/InteractionListMeta'

    InteractionSource:
      type: object
      required: [source_id, source_type, snippet, relevance_score]
      properties:
        source_id: { type: string }
        source_type: { type: string }
        snippet: { type: string }
        relevance_score:
          type: number
          format: float

    InteractionSources:
      type: object
      description: "GET /interactions/{id}/sources body."
      required: [interaction_id, source_count, deleted_sources_count, sources]
      properties:
        interaction_id: { type: string }
        source_count: { type: integer }
        deleted_sources_count: { type: integer }
        sources:
          type: array
          items:
            $ref: '#/components/schemas/InteractionSource'

    # ============ Operation log domain (F18a §6.1) ============
    OperationLogEntry:
      type: object
      description: "One operation log row. Optional columns are JSON null when unset."
      required: [id, timestamp, user_id, action, resource_type]
      properties:
        id: { type: string }
        timestamp:
          type: integer
          format: int64
          description: "Unix-ms event time."
        user_id: { type: string }
        action:
          type: string
          description: "Action enum value (e.g. memory_extract, memory_invalidate, memory_revoke, document_upload, ...)."
        namespace_id:
          type: string
          nullable: true
        resource_type: { type: string }
        resource_id:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
          description: "≤100 chars; an LLM-extracted summary is prefixed '[auto] '."
        trace_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true

    OperationLogPage:
      type: object
      description: "GET /operations body. Pagination is offset-based (no opaque cursor)."
      required: [operations, total_count, limit, offset, meta]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationLogEntry'
        total_count:
          type: integer
          format: int64
        limit: { type: integer }
        offset: { type: integer }
        meta:
          type: object
          required: [total_count, has_next, next_offset]
          properties:
            total_count:
              type: integer
              format: int64
            has_next: { type: boolean }
            next_offset: { type: integer }

    # ============ Watch domain (ARCH § 4.1.4 + F21) ============
    Watcher:
      type: object
      required: [id, path]
      properties:
        id:
          type: string
          example: "watch_001"
        path:
          type: string
          example: "/data/shared/engineering"
        target_namespaces:
          type: array
          items:
            type: string
          example: ["team_a", "team_b"]
        recursive:
          type: boolean
          default: true
        status:
          type: string
          enum: [active, paused, error]

    WatchEvent:
      type: object
      properties:
        event_id:
          type: string
        watcher_id:
          type: string
        event_type:
          type: string
          enum: [created, modified, deleted, moved]
        path:
          type: string
        namespace:
          type: string
        timestamp:
          type: string
          format: date-time

    # ============ Auth domain (ARCH § 4.1.9 + P08) ============
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
        display_name:
          type: string
          example: "Jane Doe"

    TenantRef:
      type: object
      properties:
        id:
          type: string
          example: "tenant_001"
        name:
          type: string
          example: "Cortrix"
        role:
          type: string
          enum: [owner, admin, member]

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          example: "usr_001"
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled, pending_verification]
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantRef'
        created_at:
          type: string
          format: date-time

    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
          example: "eyJ..."
        refresh_token:
          type: string
          example: "eyJ..."
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    ApiKey:
      type: object
      required: [id, prefix]
      properties:
        id:
          type: string
          example: "key_001"
        name:
          type: string
        prefix:
          type: string
          description: "key prefix (cx_live_ / cx_test_); the full key is returned only once, at creation time"
          example: "cx_live_"
        key:
          type: string
          nullable: true
          description: "Full API Key — returned only once at creation time, null thereafter"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    # ============ Tenant / ACL domain (P09) ============
    Quota:
      type: object
      properties:
        max_namespaces:
          type: integer
        max_documents:
          type: integer
        max_storage_bytes:
          type: integer
          format: int64
        used_namespaces:
          type: integer
        used_documents:
          type: integer
        used_storage_bytes:
          type: integer
          format: int64

    TenantMember:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time

    Tenant:
      type: object
      required: [tenant_id, name]
      properties:
        tenant_id:
          type: string
          example: "tenant_001"
        name:
          type: string
        owner_user_id:
          type: string
        quota:
          $ref: '#/components/schemas/Quota'
        created_at:
          type: string
          format: date-time

    NsAclEntry:
      type: object
      required: [grantee_tenant_id, permission]
      properties:
        grantee_tenant_id:
          type: string
          description: "ID of the tenant being granted access"
        permission:
          type: string
          enum: [read, write]
          description: "dedup_scope related: permission level for cross-tenant shared NS"
        granted_at:
          type: string
          format: date-time

    # ============ Agent domain (F48 v1.0.2 / V14 J8) ============
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Help me look up last month's sales contracts"
        session_id:
          type: string
          nullable: true
          description: "Continue an existing session; null = new session"
        namespace:
          type: string
          nullable: true

    AgentSession:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          example: "sess_abc"
        tenant_id:
          type: string
          nullable: true
          description: >-
            Class-A field, always returned (AGENT_FRIENDLY § 2). In a CE single-tenant environment the value is null
            (Class-A null-allowed clause, F48's first instance) — treat as default/unset, not as an error.
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
              created_at:
                type: string
                format: date-time
        created_at:
          type: string
          format: date-time

    # ============ System domain (ARCH § 4.1.11 + V14 J8) ============
    AgentLlmConfig:
      type: object
      description: "Agent LLM configuration (GET returns it redacted; PUT is an admin-only update)."
      properties:
        provider:
          type: string
          enum: [openai, deepseek, azure]
        model:
          type: string
          example: "gpt-4o-mini"
        api_key_set:
          type: boolean
          description: "Redacted: only exposes whether a key is configured, never returns the key in plaintext"
        base_url:
          type: string
          nullable: true

    NsStats:
      type: object
      description: "Per-namespace metrics dictionary."
      properties:
        namespace:
          type: string
        document_count:
          type: integer
        chunk_count:
          type: integer
        storage_bytes:
          type: integer
          format: int64
        last_query_at:
          type: string
          format: date-time
          nullable: true

    # ============ GC / ops domain (P03 v1.0.1 § 2.13) ============
    GcStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running]
        soft_deleted_count:
          type: integer
        reclaimable_bytes:
          type: integer
          format: int64
        last_gc_at:
          type: integer
          format: int64
          nullable: true
          description: "Unix epoch milliseconds of the last GC run (same convention as latency_ms / F13 timestamps); null if GC has never run."

    # ============ Batch submit domain (TD-F42-BULK §2.2/§2.3, Wave D-R1) ============
    BatchSubmitDocument:
      type: object
      description: "One document in a batch submission."
      required: [doc_id, content]
      properties:
        doc_id:
          type: string
          description: "Client-provided stable identifier, unique within the batch."
          example: "doc_001"
        content:
          type: string
          description: "Document content (inline). url / file_path variants are Phase 2."
        metadata:
          type: object
          additionalProperties: true

    BatchSubmitOptions:
      type: object
      description: "Batch submission options."
      properties:
        async:
          type: boolean
          default: true
          description: "Always true in V1 (F42 async processing, topic 3)."
        on_duplicate:
          type: string
          enum: [skip, overwrite, error]
          default: skip
          description: "Per-doc duplicate-content policy (topic 2)."

    BatchSubmitRequest:
      type: object
      required: [namespace, documents]
      properties:
        namespace:
          type: string
          example: "my-docs"
        documents:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchSubmitDocument'
        options:
          $ref: '#/components/schemas/BatchSubmitOptions'

    BatchSubmitResultItem:
      type: object
      description: "Accepted per-document submission result (an entry of results[])."
      required: [doc_id, task_id, status]
      properties:
        doc_id:
          type: string
          example: "doc_001"
        task_id:
          type: string
          description: "F42 task_id for polling GET /documents/tasks/{task_id}/progress."
          example: "task_xxx_001"
        status:
          type: string
          enum: [submitted, skipped]
          description: "submitted = queued to F42; skipped = on_duplicate=skip matched."
          example: submitted

    BatchSubmitFailureItem:
      type: object
      description: "Per-document failure in the standard error fields. error_code is the existing CX_ERR_* code of the step that failed."
      required: [doc_id, error_code, category, retryable]
      properties:
        doc_id:
          type: string
          example: "doc_003"
        error_code:
          type: string
          pattern: "^CX_ERR_[A-Z][A-Z_]*$"
          example: "CX_ERR_NS_QUOTA_EXCEEDED"
        category:
          type: string
          enum: [auth, quota, transient, permanent, timeout]
        retryable:
          type: boolean
        retry_after_ms:
          type: integer
          nullable: true
        structured_data:
          type: object
          nullable: true
          additionalProperties: true

    BatchSubmitMeta:
      type: object
      description: "Partial-success meta; coverage_ratio = succeeded / total_submitted."
      required: [succeeded, failed, coverage_ratio, total_submitted]
      properties:
        succeeded:
          type: array
          items:
            type: string
          description: "doc_ids successfully submitted (or skipped)."
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BatchSubmitFailureItem'
        coverage_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.5
        total_submitted:
          type: integer
          example: 4

    BatchSubmitResponse:
      type: object
      description: "Batch submission partial-success response. HTTP 200 even with per-document failures; a rejection of the whole batch returns the standard error response."
      required: [results, meta]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchSubmitResultItem'
        meta:
          $ref: '#/components/schemas/BatchSubmitMeta'
