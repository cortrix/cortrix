# paths/agent.yaml — /api/v1/agent/* (reverse-proxied through cortrix-server :8420) — 3 endpoints
# Key: chat = SSE streaming (x-cortrix-stream: SSE; Schemathesis skips JSON schema validation).
paths:
  /agent/chat:
    post:
      tags: [public]
      operationId: agentChat
      summary: Agent chat (SSE streaming)
      description: |
        SSE streaming chat (text/event-stream). Streaming chunks + the terminal meta JSON frame do not go through standard OpenAPI
        response schema validation (annotated x-cortrix-stream: SSE; Schemathesis response_schema_conformance skips it).
        The terminal meta frame includes tenant_id (null in CE environments — Class-A null-allowed clause).
      x-cortrix-agent-workflow: public
      x-cortrix-retryable: false
      x-cortrix-retry-strategy: no_retry
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "ns:read"
      x-cortrix-side-effects: write
      x-cortrix-stream: SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE event stream (text/event-stream). Each event is a chunk; the terminal frame includes meta.
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE stream (data: {...}\\n\\n sequence; not a JSON object, hence typed as string)"
        '400': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '429': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '504': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }

  /agent/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [public]
      operationId: getAgentSession
      summary: Get agent session history
      description: Session history (Read+). tenant_id is null in CE environments (Class-A null-allowed clause).
      x-cortrix-agent-workflow: public
      x-cortrix-retryable: true
      x-cortrix-retry-strategy: exponential_backoff
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "ns:read"
      x-cortrix-side-effects: read_only
      responses:
        '200':
          description: Session history
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/AgentSession'
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '404': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }

  /agent/health:
    get:
      tags: [public]
      operationId: getAgentHealth
      summary: Agent health check
      description: Agent health check. No authentication required.
      x-cortrix-agent-workflow: ops
      x-cortrix-retryable: true
      x-cortrix-retry-strategy: exponential_backoff
      x-cortrix-auth-required: false
      x-cortrix-side-effects: read_only
      security: []
      responses:
        '200':
          description: agent healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  llm_available: { type: boolean }
