# paths/namespaces.yaml — /api/v1/namespaces/* (ARCH § 4.1.1) — 5 endpoint
# SoT: ARCH § 4.1.1 + components/schemas.yaml (Namespace / NamespaceCreateRequest)
paths:
  /namespaces:
    post:
      tags: [admin]
      operationId: createNamespace
      summary: Create namespace
      description: Create a namespace (Admin+).
      x-cortrix-agent-workflow: admin
      x-cortrix-retryable: false
      x-cortrix-retry-strategy: no_retry
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "tenant:admin"
      x-cortrix-side-effects: write
      x-cortrix-rate-limit: "20/min/tenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/NamespaceCreateRequest'
      responses:
        '201':
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Namespace'
        '400': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '403': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '409': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '429': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
    get:
      tags: [public]
      operationId: listNamespaces
      summary: List namespaces
      description: List authorized namespaces (Read+).
      x-cortrix-agent-workflow: public
      x-cortrix-retryable: true
      x-cortrix-retry-strategy: exponential_backoff
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "ns:read"
      x-cortrix-side-effects: read_only
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Namespace list
          content:
            application/json:
              schema:
                type: object
                required: [namespaces]
                properties:
                  namespaces:
                    type: array
                    items:
                      $ref: '../components/schemas.yaml#/components/schemas/Namespace'
                  total: { type: integer }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '429': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }

  /namespaces/{ns}:
    parameters:
      - name: ns
        in: path
        required: true
        schema: { type: string }
        description: namespace name
    get:
      tags: [public]
      operationId: getNamespace
      summary: Get namespace
      description: Get namespace details (Read+).
      x-cortrix-agent-workflow: public
      x-cortrix-retryable: true
      x-cortrix-retry-strategy: exponential_backoff
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "ns:read"
      x-cortrix-side-effects: read_only
      responses:
        '200':
          description: Namespace details
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Namespace'
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '404': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
    patch:
      tags: [admin]
      operationId: updateNamespace
      summary: Update namespace
      description: Update namespace configuration (Admin+).
      x-cortrix-agent-workflow: admin
      x-cortrix-retryable: false
      x-cortrix-retry-strategy: no_retry
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "tenant:admin"
      x-cortrix-side-effects: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                description: { type: string }
                chunk_strategy:
                  $ref: '../components/schemas.yaml#/components/schemas/ChunkStrategy'
                visibility:
                  type: string
                  enum: [private, tenant, public]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Namespace'
        '400': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '403': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '404': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
    delete:
      tags: [admin]
      operationId: deleteNamespace
      summary: Delete namespace
      description: Delete a namespace and all its data (Owner). Irreversible.
      x-cortrix-agent-workflow: admin
      x-cortrix-retryable: false
      x-cortrix-retry-strategy: no_retry
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "tenant:admin"
      x-cortrix-side-effects: destructive
      responses:
        '202':
          description: Deletion accepted (asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  status: { type: string, enum: [deleting] }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '403': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '404': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }

  /namespaces/{ns}/enrich/backfill:
    parameters:
      - name: ns
        in: path
        required: true
        schema: { type: string }
        description: namespace name
    post:
      tags: [admin]
      operationId: enrichBackfill
      summary: Audit and backfill chunk enrichment
      description: |
        Operator entry point for the chunk-level enrichment ledger (Admin+).
        With `audit` on (the default), contextual index entries for chunks the ingest
        excludes (skip-index chunks, documents below the full processing level) are
        removed first. Then the namespace's chunks are compared against the
        configured enricher chain: chunks missing an artifact get a pending ledger row,
        and rows that gave up although every configured artifact is now present are
        settled. With `reset_given_up` on, every row that gave up and whose chunk still
        exists is moved back to pending with a fresh attempt count; rows whose chunk no
        longer exists are left as they are and reported in `orphaned_skipped`. The reset
        runs after the audit, so with both on a row that gave up but is complete is
        settled rather than re-delivered; with `audit` off such a row is re-delivered at
        provider cost. Every pending row is then made due and one backfill sweep runs
        for this namespace.
        The body is optional; when present it must be a JSON object holding only these
        two boolean fields, otherwise the request is rejected with
        `CX_ERR_ENRICH_BACKFILL_INVALID_BODY`. When no enricher chain is configured the
        request is rejected with `CX_ERR_ENRICH_BACKFILL_NOT_CONFIGURED`.
        When the audit or the reset fails, the error carries `structured_data.removed`:
        the number of contextual index entries this request removed before the
        failure, 0 when it removed none. Those removals stay in place: the failure does
        not undo them, and a later request removes what remains and reports only that.
        A request that fails before the audit starts, for example because the
        namespace's store cannot be opened, carries no `removed`, and nothing was
        removed.
      x-cortrix-agent-workflow: admin
      x-cortrix-retryable: false
      x-cortrix-retry-strategy: no_retry
      x-cortrix-auth-required: true
      x-cortrix-auth-scope: "tenant:admin"
      x-cortrix-side-effects: write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                audit:
                  type: boolean
                  default: true
                  description: Compare chunks against the configured chain; synthesize owed rows and settle complete ones.
                reset_given_up:
                  type: boolean
                  default: false
                  description: Move rows that gave up, and whose chunk still exists, back to pending with a fresh attempt count.
      responses:
        '200':
          description: Backfill ran; every count is present on every response, 0 when its step did not run.
          content:
            application/json:
              schema:
                type: object
                required: [namespace, audited, reset_given_up, removed, synthesized, settled, reset, orphaned_skipped, enqueued]
                properties:
                  namespace: { type: string }
                  audited: { type: boolean, description: whether the audit step ran }
                  reset_given_up: { type: boolean, description: whether the reset step ran }
                  removed: { type: integer, description: contextual index entries removed by this request for chunks the ingest excludes }
                  synthesized: { type: integer, description: ledger rows created or re-owed by the audit }
                  settled: { type: integer, description: rows that had given up but are complete, settled by the audit }
                  reset: { type: integer, description: rows that had given up, moved back to pending by the reset }
                  orphaned_skipped: { type: integer, description: rows that had given up whose chunk no longer exists, left as they are }
                  enqueued: { type: integer, description: backfill tasks enqueued by the sweep that followed }
                  counts:
                    type: object
                    description: ledger totals after this call
                    properties:
                      total: { type: integer }
                      ok: { type: integer }
                      pending_retry: { type: integer }
                      failed_permanent: { type: integer }
        '400': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '401': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '403': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '404': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '500': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
        '503': { $ref: '../components/errors.yaml#/components/responses/ErrorResponseV1' }
